name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: unzip -o EmuladorPS2-projeto-v2.zip

      - name: Download and extract ARMSX2 core libraries
        run: |
          APK_URL=$(curl -s https://github.com | grep "browser_download_url.*\.apk" | head -n 1 | cut -d '"' -f 4)
          echo "Downloading from: $APK_URL"
          curl -L "$APK_URL" -o armsx2_latest.apk
          mkdir -p temp_extract app/src/main/jniLibs/arm64-v8a
          unzip -o armsx2_latest.apk "lib/arm64-v8a/*" -d temp_extract/
          mv temp_extract/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          rm -f app/src/main/jniLibs/arm64-v8a/libemucore_16k.so
          ls -lh app/src/main/jniLibs/arm64-v8a/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
